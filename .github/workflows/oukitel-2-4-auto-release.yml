name: OukitelMonitor Android 2.4 Zoom Auto Release
on:
  push:
    branches: [main]
    # Windows updates should not trigger another Android APK build.
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - '.github/workflows/oukitel-2-4-auto-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply existing 1.5 UI changes
        run: python3 scripts/update_ui_15.py
      - name: Apply 1.6 refresh and status update
        run: python3 scripts/update_16.py
      - name: Apply 1.7 voltage and chart changes
        run: python3 scripts/update_17.py
      - name: Apply 1.8 automatic session renewal
        run: python3 scripts/update_18.py
      - name: Apply 1.9 sync notification charge
        run: python3 scripts/update_19.py
      - name: Remove voltage card (previous 1.10)
        run: python3 scripts/update_110.py
      - name: Configure Oukitel Monitor 2.1 signed release
        run: python3 scripts/update_21_signing.py
      - name: Add in-app GitHub Releases updater for Android 2.2
        run: python3 scripts/update_22_inapp.py
      - name: Fix power outage and restoration notifications for Android 2.3
        run: python3 scripts/update_23_power_alerts.py
      - name: Add battery chart pinch-to-zoom for Android 2.4
        run: python3 scripts/update_24_chart_zoom.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found"
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Load existing MalinForest signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.MALINFOREST_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.MALINFOREST_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.MALINFOREST_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.MALINFOREST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing GitHub Secret for $secret in this repository"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oukitel-release.jks"
          test -s "$RUNNER_TEMP/oukitel-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/oukitel-release.jks" \
            -storetype PKCS12 -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null
          # Distinct, increasing build code for successive Actions runs.
          echo "OUKITEL_BUILD_CODE=$((240000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "OUKITEL_KEYSTORE_FILE=$RUNNER_TEMP/oukitel-release.jks" >> "$GITHUB_ENV"
          echo "OUKITEL_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OUKITEL_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OUKITEL_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Test power alert transitions
        run: gradle --no-daemon testReleaseUnitTest
      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease
      - name: Verify APK digital signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose "app/build/outputs/apk/release/app-release.apk"
      # Read versionName after every Android update patch has run, then give
      # the actual APK (not merely its artifact ZIP) a human-readable name.
      - name: Name APK from current Android version
        id: apk_name
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          versions = re.findall(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', gradle, re.MULTILINE)
          if len(versions) != 1 or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}(?:[-.][a-zA-Z0-9]+)*", versions[0]):
              raise SystemExit("Could not determine a safe, unique Android versionName")
          version = versions[0]
          source = Path("app/build/outputs/apk/release/app-release.apk")
          if not source.is_file():
              raise SystemExit("Signed release APK was not produced")
          target = source.with_name(f"OukitelMonitor-{version}.apk")
          source.rename(target)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"apk_path={target.as_posix()}\n")
          print(f"Release APK: {target}")
          PYTHON
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: OukitelMonitor-${{ steps.apk_name.outputs.version }}
          path: ${{ steps.apk_name.outputs.apk_path }}
          if-no-files-found: error
      # GitHub Actions Artifacts require a GitHub account to download.
      # Public Releases make the signed APK available to the Android app.
      - name: Publish signed APK in GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VERSION: ${{ steps.apk_name.outputs.version }}
          APK_PATH: ${{ steps.apk_name.outputs.apk_path }}
        run: |
          set -euo pipefail
          tag="v${APK_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$APK_PATH")"; then
              echo "::notice::Release $tag with $(basename "$APK_PATH") already exists. To publish a new version, increase versionName."
            else
              echo "Adding the missing APK to existing release $tag"
              gh release upload "$tag" "$APK_PATH" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Oukitel Monitor ${APK_VERSION}" \
              --notes "Підписане оновлення Android-додатка Oukitel Monitor ${APK_VERSION}. Встановлення через налаштування додатка або вручну." \
              --latest
          fi
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/oukitel-release.jks"
