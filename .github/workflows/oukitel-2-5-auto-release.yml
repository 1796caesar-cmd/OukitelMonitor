name: OukitelMonitor Android Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - '.github/workflows/oukitel-2-5-auto-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oukitel-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply 1.5 UI
        run: python3 scripts/update_ui_15.py
      - name: Apply 1.6
        run: python3 scripts/update_16.py
      - name: Apply 1.7
        run: python3 scripts/update_17.py
      - name: Apply 1.8
        run: python3 scripts/update_18.py
      - name: Apply 1.9
        run: python3 scripts/update_19.py
      - name: Apply prior 1.10 cleanup
        run: python3 scripts/update_110.py
      - name: Configure signed release 2.1
        run: python3 scripts/update_21_signing.py
      - name: Add in-app updates 2.2
        run: python3 scripts/update_22_inapp.py
      - name: Fix power notifications 2.3
        run: python3 scripts/update_23_power_alerts.py
      - name: Add chart zoom 2.4
        run: python3 scripts/update_24_chart_zoom.py

      - name: Add outage schedules 2.5-2.12
        shell: bash
        run: |
          set -euo pipefail
          # Legacy patch compatibility: update_16 renamed refresh to connectionText.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/update_25_outage_schedule.py")
          s = p.read_text(encoding="utf-8")
          old = "    private lateinit var refresh: TextView"
          new = "    private lateinit var connectionText: TextView"
          count = s.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 old field anchors, found {count}")
          p.write_text(s.replace(old, new), encoding="utf-8")
          PY
          python3 scripts/update_25_outage_schedule.py

      - name: Apply OukitelMonitor 2.13 3D indicator styles and themed update dialogs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Android 2.13: 3D charge gauges, submenu for indicator style, themed update result dialogs.
          Run immediately after update_25_outage_schedule.py has produced version 2.12.
          """
          from pathlib import Path
          ROOT = Path.cwd()
          MAIN = ROOT/'app/src/main/java/com/oukitel/monitor/MainActivity.kt'
          UPD = ROOT/'app/src/main/java/com/oukitel/monitor/UpdateManager.kt'
          GRADLE = ROOT/'app/build.gradle.kts'
          main = MAIN.read_text(encoding='utf8')
          upd = UPD.read_text(encoding='utf8')
          gradle = GRADLE.read_text(encoding='utf8')
          
          def once(s, old, new, title):
              n=s.count(old)
              if n!=1: raise RuntimeError(f'2.13 {title}: expected 1 match, found {n}')
              return s.replace(old,new,1)
          
          # Keep existing preferences, existing percentage text and exact five style IDs.
          start='    private inner class BatteryView(private val previewStyle: Int? = null) : android.widget.FrameLayout(this) {'
          end='    private data class AlertRule('
          if main.count(start)!=1 or main.count(end)!=1: raise RuntimeError('2.13 BatteryView boundaries not unique')
          new_battery = r'''    /** Real 3D-style Canvas indicators: the miniature preview and main dial share a renderer. */
              private inner class BatteryView(private val previewStyle: Int? = null) : android.widget.FrameLayout(this) {
                  var level: Int = if (previewStyle == null) 0 else 75
                      set(value) { field = value.coerceIn(0, 100); invalidate() }
          
                  val percent = text(if (previewStyle == null) "—%" else "75%",
                      if (previewStyle == null) 65f else 23f, white, true).apply {
                      gravity = Gravity.CENTER
                  }
          
                  init {
                      setWillNotDraw(false)
                      // Soft relief shadows require software shadow rendering only for this small gauge view.
                      setLayerType(View.LAYER_TYPE_SOFTWARE, null)
                      val center = column().apply { gravity = Gravity.CENTER }
                      add(center, percent)
                      add(center, text(if (previewStyle == null) "Заряд батареї" else "Заряд",
                          if (previewStyle == null) 16f else 9f, muted).apply { gravity = Gravity.CENTER })
                      addView(center, android.widget.FrameLayout.LayoutParams(
                          dp(if (previewStyle == null) 230 else 95),
                          dp(if (previewStyle == null) 105 else 62), Gravity.CENTER))
                  }
          
                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val d = resources.displayMetrics.density
                      val mini = previewStyle != null
                      val cx = width / 2f
                      val cy = height / 2f
                      val radius = minOf(width / 2f - (if (mini) 18f else 36f)*d,
                          height / 2f - (if (mini) 18f else 30f)*d)
                          .coerceAtLeast(if (mini) 26f*d else 40f*d)
                      val arc = RectF(cx-radius, cy-radius, cx+radius, cy+radius)
                      val charge = level.coerceIn(0, 100)
                      val ratio = charge / 100f
                      val style = (previewStyle ?: prefs().getInt("battery_indicator_style", 0)).coerceIn(0, 4)
                      // These alert colors remain fixed in all six themes.
                      val active = when {
                          charge <= 15 -> Color.rgb(238, 82, 73)
                          charge <= 30 -> Color.rgb(244, 180, 62)
                          else -> Color.rgb(43, 203, 101)
                      }
                      val lightActive = blend(active, Color.WHITE, 0.34f)
                      val darkActive = blend(active, Color.BLACK, 0.33f)
                      val track = blend(panel, Color.BLACK, 0.32f)
                      val raisedTrack = blend(panel, muted, 0.20f)
                      val p = Paint(Paint.ANTI_ALIAS_FLAG)
          
                      fun arcStroke(box: RectF, first: Float, sweep: Float, thickness: Float,
                                    color: Int, glossy: Boolean, rounded: Boolean = true) {
                          if (sweep == 0f) return
                          p.reset()
                          p.isAntiAlias = true
                          p.style = Paint.Style.STROKE
                          p.strokeCap = if (rounded) Paint.Cap.ROUND else Paint.Cap.BUTT
                          // Soft recessed lower rim and cast shadow form the visible depth.
                          p.strokeWidth = thickness + (if (glossy) 2.6f else 2f)*d
                          p.color = blend(color, Color.BLACK, 0.55f)
                          p.setShadowLayer((if (mini) 2f else 5f)*d, 0f, (if (mini) 1f else 3f)*d,
                              Color.argb(if (glossy) 105 else 70, 0, 0, 0))
                          canvas.drawArc(box, first, sweep, false, p)
                          p.clearShadowLayer()
                          p.strokeWidth = thickness
                          p.color = color
                          if (glossy) p.shader = LinearGradient(box.left, box.top, box.right, box.bottom,
                              intArrayOf(lightActive, active, darkActive), null, Shader.TileMode.CLAMP)
                          canvas.drawArc(box, first, sweep, false, p)
                          p.shader = null
                          // Narrow illuminated edge follows the same visible part of the gauge.
                          if (glossy) {
                              val shift = (if (mini) 2.5f else 5f)*d
                              val inner = RectF(box.left+shift, box.top+shift,
                                  box.right-shift, box.bottom-shift)
                              p.strokeWidth = (if (mini) 1.1f else 2.5f)*d
                              p.color = Color.argb(155, 255, 255, 255)
                              canvas.drawArc(inner, first, sweep, false, p)
                          }
                          p.reset()
                          p.isAntiAlias = true
                      }
          
                      // A faint recessed bowl makes all five styles look raised instead of flat.
                      p.style = Paint.Style.FILL
                      p.shader = RadialGradient(cx, cy-radius*0.20f, radius*1.20f,
                          intArrayOf(blend(panel, white, 0.10f), panel, blend(panel, Color.BLACK, 0.15f)),
                          null, Shader.TileMode.CLAMP)
                      canvas.drawCircle(cx, cy, radius*0.83f, p)
                      p.shader = null
          
                      when (style) {
                          0 -> {
                              // Familiar full circle, now with beveled rim and reflected light.
                              val width = (if (mini) 10f else 25f)*d
                              arcStroke(arc, 0f, 360f, width, raisedTrack, false)
                              arcStroke(arc, -90f, 360f*ratio, width, active, true)
                          }
                          1 -> {
                              // Both neon arc bars start at the TOP and shrink together to the BOTTOM.
                              // Left travels counter-clockwise; right clockwise; BOTH get the same ratio.
                              val width = (if (mini) 10f else 23f)*d
                              val firstRight = -71f
                              val firstLeft = 251f
                              val sweep = 142f
                              arcStroke(arc, firstRight, sweep, width, raisedTrack, false, false)
                              arcStroke(arc, 109f, sweep, width, raisedTrack, false, false)
                              arcStroke(arc, firstRight, sweep*ratio, width, active, true, false)
                              arcStroke(arc, firstLeft, -sweep*ratio, width, active, true, false)
                              // Fine bezel outside the bright parallel bars.
                              val outer = RectF(arc.left-12*d, arc.top-12*d, arc.right+12*d, arc.bottom+12*d)
                              p.style = Paint.Style.STROKE
                              p.strokeWidth = (if (mini) 0.8f else 1.4f)*d
                              p.color = blend(muted, panel, 0.40f)
                              canvas.drawArc(outer, -72f, 144f, false, p)
                              canvas.drawArc(outer, 108f, 144f, false, p)
                          }
                          2 -> {
                              // Domed liquid battery: glass rim, shaded fluid and specular sheen.
                              val disk = Path().apply { addCircle(cx, cy, radius, Path.Direction.CW) }
                              p.style = Paint.Style.FILL
                              p.shader = RadialGradient(cx-radius*0.24f, cy-radius*0.32f,
                                  radius*1.8f, intArrayOf(blend(panel, white, 0.30f),
                                      blend(panel, Color.BLACK, 0.30f)), null, Shader.TileMode.CLAMP)
                              canvas.drawCircle(cx, cy, radius, p)
                              p.shader = null
                              canvas.save()
                              canvas.clipPath(disk)
                              val surface = cy+radius - radius*2f*ratio
                              p.shader = LinearGradient(cx-radius, cy-radius, cx+radius, cy+radius,
                                  intArrayOf(lightActive, active, darkActive), null, Shader.TileMode.CLAMP)
                              canvas.drawRect(cx-radius, surface, cx+radius, cy+radius, p)
                              p.shader = null
                              if (charge in 1..99) {
                                  p.style = Paint.Style.STROKE
                                  p.strokeWidth = (if (mini) 1.2f else 3f)*d
                                  p.color = Color.argb(180, 255, 255, 255)
                                  canvas.drawLine(cx-radius, surface, cx+radius, surface, p)
                              }
                              p.style = Paint.Style.FILL
                              p.color = Color.argb(54,255,255,255)
                              canvas.drawOval(RectF(cx-radius*0.72f, cy-radius*0.78f,
                                  cx+radius*0.58f, cy-radius*0.37f), p)
                              canvas.restore()
                              p.style = Paint.Style.STROKE
                              p.strokeWidth = (if (mini) 3f else 6f)*d
                              p.color = darkActive
                              p.setShadowLayer((if (mini) 2f else 4f)*d, 0f, 2f*d, Color.argb(130,0,0,0))
                              canvas.drawCircle(cx,cy,radius,p)
                              p.clearShadowLayer()
                              p.strokeWidth = (if (mini) 1f else 2.6f)*d
                              p.color = lightActive
                              canvas.drawCircle(cx,cy,radius-3*d,p)
                          }
                          3 -> {
                              // Bold unobstructed 280-degree relief arc; NO battery glyph.
                              val width = (if (mini) 12f else 24f)*d
                              arcStroke(arc, 130f, 280f, width, raisedTrack, false)
                              arcStroke(arc, 130f, 280f*ratio, width, active, true)
                          }
                          else -> {
                              // Pastel tachometer: thicker raised 48 ticks and a soft 3D disk.
                              val diskRadius = radius*0.76f
                              p.style = Paint.Style.FILL
                              p.shader = RadialGradient(cx-radius*0.19f,cy-radius*0.25f,radius*1.25f,
                                  intArrayOf(blend(panel,white,0.39f),
                                      blend(panel,active,0.20f),blend(panel,Color.BLACK,0.16f)),
                                  null,Shader.TileMode.CLAMP)
                              canvas.drawCircle(cx,cy,diskRadius,p)
                              p.shader = null
                              for (i in 0 until 48) {
                                  val angle = Math.toRadians(-90.0 + i*7.5)
                                  val r1 = radius*0.82f
                                  val r2 = radius*(if (i%4==0) 1.09f else 1.02f)
                                  val ax = cx+Math.cos(angle).toFloat()*r1
                                  val ay = cy+Math.sin(angle).toFloat()*r1
                                  val bx = cx+Math.cos(angle).toFloat()*r2
                                  val by = cy+Math.sin(angle).toFloat()*r2
                                  val filled = i < ratio*48f
                                  val sw = (if (i%4==0) (if (mini) 4.4f else 6.5f)
                                      else (if (mini) 3.4f else 5.3f))*d
                                  p.style=Paint.Style.STROKE
                                  p.strokeCap=Paint.Cap.ROUND
                                  p.strokeWidth=sw+1.4f*d
                                  p.color=blend(panel,Color.BLACK,0.57f)
                                  canvas.drawLine(ax,ay+1.6f*d,bx,by+1.6f*d,p)
                                  p.strokeWidth=sw
                                  p.color=if(filled) active else blend(muted,panel,0.48f)
                                  if(filled) p.shader=LinearGradient(ax,ay,bx,by,
                                      lightActive,darkActive,Shader.TileMode.CLAMP)
                                  canvas.drawLine(ax,ay,bx,by,p)
                                  p.shader=null
                                  if(filled) {
                                      p.strokeWidth=(if(mini) 0.7f else 1.5f)*d
                                      p.color=Color.argb(170,255,255,255)
                                      canvas.drawLine(ax-0.7f*d,ay-0.7f*d,bx-0.7f*d,by-0.7f*d,p)
                                  }
                              }
                              p.style=Paint.Style.STROKE
                              p.strokeWidth=(if(mini) 1.3f else 2.4f)*d
                              p.color=blend(muted,active,0.34f)
                              canvas.drawCircle(cx,cy,radius*0.78f,p)
                              p.color=blend(panel,white,0.34f)
                              canvas.drawCircle(cx,cy,radius*0.70f,p)
                          }
                      }
                  }
              }
          
          '''
          ix=main.index(start)
          jx=main.index(end,ix)
          main=main[:ix]+new_battery+main[jx:]
          
          # Remove the long preview cards from the main settings page; make a single entry.
          main=once(main,
          '''        addBatteryRingSettings(root)
                  gap(root,26)''',
          '''        val indicatorMenu = text("◉   Вигляд індикатора     ›", 17f, white, true).apply {
                      background = shape(panel, 20, green)
                      setPadding(dp(18), dp(18), dp(18), dp(18))
                      setOnClickListener { showBatteryIndicatorStyles() }
                  }
                  add(root, indicatorMenu); gap(root,26)''',
          'one settings entry instead of cards')
          # Existing style cards with real Canvas previews are moved into a dedicated screen.
          menu = r'''    private fun showBatteryIndicatorStyles() {
                  currentScreen = "battery_styles"
                  active = false
                  handler.removeCallbacks(tick)
                  val root = column().apply {
                      background = forestBackground()
                      setPadding(dp(18), dp(24), dp(18), dp(28))
                  }
                  val back = text("‹   Налаштування", 18f, green, true).apply {
                      setPadding(dp(2), dp(8), dp(2), dp(8))
                      setOnClickListener { showSettings() }
                  }
                  add(root, back)
                  gap(root, 14)
                  addBatteryRingSettings(root)
                  setContentView(ScrollView(this).apply {
                      background = forestBackground()
                      isFillViewport = true
                      addView(root)
                  })
              }
          
          '''
          main=once(main,'    private fun showSettings() {',menu+'    private fun showSettings() {','create indicator submenu')
          main=once(main,'            "outage_settings" -> showSettings()',
                        '            "outage_settings", "battery_styles" -> showSettings()',
                        'Android Back button returns to settings from indicator styles')
          main=once(main,'"48 окремих поділок навколо диска"',
                        '"48 об’ємних потовщених поділок навколо диска"',
                        'update pastel style label')
          
          # Add a reusable palette-matched update-check dialog, without changing download,
          # checksum validation, installation or GitHub release selection.
          new_dialog=r'''    /** Custom update-check dialog in the same six palettes as MainActivity. */
              private fun showStyledCheckDialog(activity: Activity, heading: String, message: String,
                  primaryLabel: String = "Добре", secondaryLabel: String? = null,
                  onPrimary: (() -> Unit)? = null) {
                  val themes = arrayOf(
                      intArrayOf(0xFF103B37.toInt(),0xFF235D56.toInt(),0xFF72D8BB.toInt(),0xFFF5FFFB.toInt(),0xFFC1E4DB.toInt()),
                      intArrayOf(0xFF153A64.toInt(),0xFF275A8A.toInt(),0xFF7DCBFF.toInt(),0xFFF5FAFF.toInt(),0xFFC3DDF3.toInt()),
                      intArrayOf(0xFF352457.toInt(),0xFF534078.toInt(),0xFFC7A5FF.toInt(),0xFFFCF7FF.toInt(),0xFFDFD0F3.toInt()),
                      intArrayOf(0xFF572A40.toInt(),0xFF81425B.toInt(),0xFFFFB1C7.toInt(),0xFFFFF7FA.toInt(),0xFFF1CCD8.toInt()),
                      intArrayOf(0xFF61402E.toInt(),0xFF896047.toInt(),0xFFFFD09B.toInt(),0xFFFFF9F2.toInt(),0xFFF1CCD8.toInt()),
                      intArrayOf(0xFF253451.toInt(),0xFF405575.toInt(),0xFFA9C8FF.toInt(),0xFFF7FAFF.toInt(),0xFFCEDBF0.toInt())
                  )
                  val p = activity.getSharedPreferences(PREFS, Activity.MODE_PRIVATE)
                  val theme = themes[p.getInt("palette_index", 0).coerceIn(0, themes.lastIndex)]
                  val (bg, panel, accent, ink, muted) = theme.toList()
                  val density = activity.resources.displayMetrics.density
                  fun dp(n: Int) = (n*density+0.5f).toInt()
                  fun shape(color: Int, radius: Int, border: Int? = null) =
                      android.graphics.drawable.GradientDrawable().apply {
                          setColor(color)
                          cornerRadius=dp(radius).toFloat()
                          if(border!=null) setStroke(dp(1), border)
                      }
                  fun txt(value: String, size: Float, color: Int, bold: Boolean = false) =
                      TextView(activity).apply {
                          text=value
                          textSize=size
                          setTextColor(color)
                          if(bold) typeface=android.graphics.Typeface.DEFAULT_BOLD
                          gravity=android.view.Gravity.CENTER_VERTICAL
                      }
                  val root=android.widget.LinearLayout(activity).apply {
                      orientation=android.widget.LinearLayout.VERTICAL
                      setPadding(dp(23),dp(23),dp(23),dp(22))
                      background=shape(panel,24,accent)
                  }
                  val head=android.widget.LinearLayout(activity).apply {
                      orientation=android.widget.LinearLayout.HORIZONTAL
                      gravity=android.view.Gravity.CENTER_VERTICAL
                  }
                  head.addView(txt("ϟ",31f,accent,true),
                      android.widget.LinearLayout.LayoutParams(dp(37),-2))
                  head.addView(txt("OukitelMonitor",21f,ink,true))
                  root.addView(head)
                  root.addView(txt(heading,19f,accent,true).apply {
                      setPadding(0,dp(17),0,dp(10))
                  })
                  root.addView(txt(message,15f,muted).apply {
                      setPadding(0,0,0,dp(20))
                  })
                  val actions=android.widget.LinearLayout(activity).apply {
                      orientation=android.widget.LinearLayout.HORIZONTAL
                      gravity=android.view.Gravity.END
                  }
                  val primary=txt(primaryLabel,15f,bg,true).apply {
                      gravity=android.view.Gravity.CENTER
                      setPadding(dp(17),dp(13),dp(17),dp(13))
                      background=shape(accent,14)
                  }
                  val secondary=secondaryLabel?.let { label ->
                      txt(label,15f,ink,true).apply {
                          gravity=android.view.Gravity.CENTER
                          setPadding(dp(15),dp(13),dp(15),dp(13))
                          background=shape(bg,14)
                      }
                  }
                  if(secondary!=null) {
                      actions.addView(secondary, android.widget.LinearLayout.LayoutParams(0,-2,1f).apply {
                          rightMargin=dp(9)
                      })
                  }
                  actions.addView(primary,android.widget.LinearLayout.LayoutParams(
                      if(secondary==null) -1 else 0,-2,if(secondary==null) 0f else 1f))
                  root.addView(actions)
                  val dialog=AlertDialog.Builder(activity).setView(root).setCancelable(true).create()
                  secondary?.setOnClickListener { dialog.dismiss() }
                  primary.setOnClickListener { dialog.dismiss(); onPrimary?.invoke() }
                  dialog.show()
                  dialog.window?.setBackgroundDrawable(android.graphics.drawable.ColorDrawable(android.graphics.Color.TRANSPARENT))
                  dialog.window?.setLayout((activity.resources.displayMetrics.widthPixels*0.89f).toInt(),
                      android.view.WindowManager.LayoutParams.WRAP_CONTENT)
              }
          
          '''
          upd=once(upd,'    fun checkForUpdates(activity: Activity, quiet: Boolean) {',
                   new_dialog+'    fun checkForUpdates(activity: Activity, quiet: Boolean) {',
                   'theme-aware update result dialog helper')
          upd=once(upd,
          '''                        AlertDialog.Builder(activity).setTitle("Оновлень немає")
                                      .setMessage("Встановлено Oukitel Monitor $installed. Це актуальна версія.")
                                      .setPositiveButton("Добре", null).show()''',
          '''                        showStyledCheckDialog(activity, "Оновлень немає",
                                      "Встановлено OukitelMonitor $installed. У тебе актуальна версія.")''',
                   'style no-updates result')
          upd=once(upd,
          '''                    AlertDialog.Builder(activity)
                                  .setTitle("Доступне оновлення $version")
                                  .setMessage("Установлено: $installed\\nНова версія: $version\\n\\nЗавантажити підписаний APK з нашого GitHub?")
                                  .setNegativeButton("Пізніше", null)
                                  .setPositiveButton("Завантажити") { _, _ -> downloadAndInstall(activity, release) }
                                  .show()''',
          '''                    showStyledCheckDialog(activity, "Доступне оновлення $version",
                                  "Встановлено: $installed\\nНова версія: $version\\n\\nЗавантажити підписане оновлення з GitHub?",
                                  primaryLabel = "Завантажити", secondaryLabel = "Пізніше") {
                                  downloadAndInstall(activity, release)
                              }''',
                   'style available-update result')
          upd=once(upd,
          '''                    AlertDialog.Builder(activity).setTitle("Не вдалося перевірити оновлення")
                                  .setMessage(ex.message ?: "Немає відповіді")
                                  .setPositiveButton("Добре", null).show()''',
          '''                    showStyledCheckDialog(activity, "Помилка перевірки оновлень",
                                  ex.message ?: "Немає відповіді")''',
                   'style update check failure')
          
          gradle=once(gradle,'versionName = "2.12"','versionName = "2.13"','release version bump')
          MAIN.write_text(main,encoding='utf8')
          UPD.write_text(upd,encoding='utf8')
          GRADLE.write_text(gradle,encoding='utf8')
          print('OukitelMonitor 2.13: five 3D-style battery gauges; submenu; themed check-update dialogs')
          PY

      - name: Apply OukitelMonitor 2.15 themed backgrounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          BACKGROUND_KOTLIN = r'''package com.oukitel.monitor

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.ColorFilter
          import android.graphics.LinearGradient
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.Drawable
          import java.util.LinkedHashMap
          import java.util.Random
          import kotlin.math.max

          /** Five theme-aware, deterministic background surfaces, drawn locally (no network or images). */
          object InterfaceBackground {
              private const val W = 360
              private const val H = 720
              private val cache = object : LinkedHashMap<String, Bitmap>(10, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, Bitmap>?): Boolean = size > 8
              }

              private fun mix(a: Int, b: Int, x: Float): Int {
                  val r = x.coerceIn(0f, 1f)
                  return Color.rgb(
                      (Color.red(a)*(1-r) + Color.red(b)*r).toInt(),
                      (Color.green(a)*(1-r) + Color.green(b)*r).toInt(),
                      (Color.blue(a)*(1-r) + Color.blue(b)*r).toInt()
                  )
              }

              private fun tint(c: Int, a: Int): Int = Color.argb(a.coerceIn(0,255),
                  Color.red(c), Color.green(c), Color.blue(c))

              fun create(context: Context, base: Int, panel: Int, accent: Int,
                         style: Int, intensity: Int, radiusDp: Int = 0,
                         borderColor: Int? = null): Drawable = Pattern(
                  context.resources.displayMetrics.density, base, panel, accent,
                  style.coerceIn(0, 4), intensity.coerceIn(0, 2), radiusDp, borderColor
              )

              private class Pattern(
                  private val density: Float, private val base: Int, private val panel: Int,
                  private val accent: Int, private val style: Int, private val intensity: Int,
                  private val radiusDp: Int, private val borderColor: Int?
              ) : Drawable() {
                  override fun draw(canvas: Canvas) {
                      val b = bounds
                      if (b.isEmpty) return
                      val w = b.width().toFloat()
                      val h = b.height().toFloat()
                      val radius = radiusDp*density
                      canvas.save()
                      canvas.translate(b.left.toFloat(), b.top.toFloat())
                      if (radius > 0f) {
                          val clip = Path().apply { addRoundRect(RectF(0f,0f,w,h),
                              radius,radius,Path.Direction.CW) }
                          canvas.clipPath(clip)
                      }
                      val pic = getBitmap(base, panel, accent, style, intensity)
                      val shader = BitmapShader(pic, Shader.TileMode.REPEAT, Shader.TileMode.REPEAT)
                      val scale = w/W.toFloat()
                      shader.setLocalMatrix(Matrix().apply { setScale(scale, scale) })
                      val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG).apply {
                          this.shader = shader
                      }
                      canvas.drawRect(0f, 0f, w, h, paint)
                      if (borderColor != null && radius > 0f) {
                          val border = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                              color = borderColor
                              style = Paint.Style.STROKE
                              strokeWidth = max(1f, density)
                          }
                          val inset = border.strokeWidth/2f
                          canvas.drawRoundRect(inset,inset,w-inset,h-inset,
                              (radius-inset).coerceAtLeast(0f),(radius-inset).coerceAtLeast(0f),border)
                      }
                      canvas.restore()
                  }
                  override fun setAlpha(alpha: Int) { invalidateSelf() }
                  override fun setColorFilter(colorFilter: ColorFilter?) { invalidateSelf() }
                  @Deprecated("Deprecated in Android API")
                  override fun getOpacity(): Int = PixelFormat.OPAQUE
              }

              @Synchronized private fun getBitmap(base: Int, panel: Int, accent: Int,
                                                 style: Int, intensity: Int): Bitmap {
                  val key = "$base:$panel:$accent:$style:$intensity"
                  cache[key]?.let { return it }
                  val bitmap = Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888)
                  val c = Canvas(bitmap)
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  val dark = mix(base, Color.BLACK, 0.14f)
                  val top = mix(base, Color.WHITE, 0.08f)
                  p.shader = LinearGradient(0f, 0f, W.toFloat(), H.toFloat(),
                      intArrayOf(top, base, mix(base,panel,0.55f), dark),
                      floatArrayOf(0f,0.33f,0.70f,1f),Shader.TileMode.CLAMP)
                  c.drawRect(0f,0f,W.toFloat(),H.toFloat(),p)
                  p.shader = null
                  if (style == 0) {
                      cache[key] = bitmap
                      return bitmap
                  }
                  val rng = Random(2718281L + style*1009L + intensity*151L)
                  val gain = floatArrayOf(0.55f, 1f, 1.5f)[intensity]
                  fun alpha(v: Float) = (v*gain).toInt().coerceIn(0, 130)
                  fun randx(): Float = rng.nextFloat()*W
                  fun randy(): Float = rng.nextFloat()*H
                  fun cloud(x: Float, y: Float, rx: Float, ry: Float, color: Int, opacity: Int) {
                      c.save()
                      c.translate(x,y)
                      c.scale(rx,ry)
                      p.style = Paint.Style.FILL
                      p.shader = RadialGradient(0f,0f,1f,
                          intArrayOf(tint(color, opacity), tint(color,opacity/3),Color.TRANSPARENT),
                          floatArrayOf(0f,0.44f,1f),Shader.TileMode.CLAMP)
                      c.drawCircle(0f,0f,1f,p)
                      p.shader = null
                      c.restore()
                  }
                  when(style) {
                      1 -> { // Granite: mottled mineral grains and faint irregular veins.
                          for (i in 0 until 26) {
                              cloud(randx(),randy(), 25f+rng.nextFloat()*105f,
                                  30f+rng.nextFloat()*130f,
                                  if (i%2==0) panel else mix(base,Color.WHITE,0.28f),alpha(23f))
                          }
                          for (i in 0 until (650 + intensity*350)) {
                              val bright = rng.nextBoolean()
                              p.style = Paint.Style.FILL
                              p.color = tint(if(bright) mix(accent,Color.WHITE,0.5f)
                                             else Color.BLACK,alpha(if(bright) 22f else 20f))
                              val r = 0.3f + rng.nextFloat()*1.1f
                              c.drawCircle(randx(),randy(),r,p)
                          }
                          for (i in 0 until 14) {
                              val x=randx(); val y=randy()
                              val vein=Path().apply {
                                  moveTo(x,y)
                                  quadTo(x+12f+rng.nextFloat()*35f,y+10f,
                                      x+32f+rng.nextFloat()*70f,y+45f+rng.nextFloat()*85f)
                              }
                              p.style=Paint.Style.STROKE
                              p.strokeWidth=0.45f+rng.nextFloat()*0.8f
                              p.color=tint(mix(accent,Color.WHITE,0.45f),alpha(26f))
                              c.drawPath(vein,p)
                          }
                      }
                      2 -> { // Facets: translucent polygonal surfaces and illuminated ridges.
                          val cols=5; val rows=10
                          val pts=Array(rows+1) { y -> Array(cols+1) { x ->
                              floatArrayOf(x*W.toFloat()/cols+(rng.nextFloat()-0.5f)*35f,
                                           y*H.toFloat()/rows+(rng.nextFloat()-0.5f)*35f) } }
                          for (y in 0 until rows) for (x in 0 until cols) {
                              val a=pts[y][x];val b=pts[y][x+1]
                              val d=pts[y+1][x];val e=pts[y+1][x+1]
                              val triangles=arrayOf(arrayOf(a,b,e),arrayOf(a,e,d))
                              for ((idx,t) in triangles.withIndex()) {
                                  val path=Path().apply {
                                      moveTo(t[0][0],t[0][1]);lineTo(t[1][0],t[1][1])
                                      lineTo(t[2][0],t[2][1]);close()
                                  }
                                  val c0=if((x+y+idx)%3==0) mix(accent,Color.WHITE,0.4f)
                                         else if((x+y+idx)%3==1) Color.BLACK else panel
                                  p.style=Paint.Style.FILL
                                  p.color=tint(c0,alpha(19f+rng.nextFloat()*14f))
                                  c.drawPath(path,p)
                                  p.style=Paint.Style.STROKE
                                  p.strokeWidth=0.5f
                                  p.color=tint(mix(accent,Color.WHITE,0.45f),alpha(17f))
                                  c.drawPath(path,p)
                              }
                          }
                      }
                      3 -> { // Matte smoky: low-contrast broad powdery charcoal plumes.
                          for (i in 0 until 28) {
                              val bright=i%3==0
                              cloud(randx(),randy(),40f+rng.nextFloat()*170f,
                                  24f+rng.nextFloat()*95f,
                                  if(bright) mix(panel,Color.WHITE,0.24f) else Color.BLACK,
                                  alpha(if(bright) 33f else 24f))
                          }
                          for (i in 0 until 180) {
                              p.style=Paint.Style.FILL
                              p.color=tint(mix(panel,Color.WHITE,0.32f),alpha(10f))
                              c.drawCircle(randx(),randy(),0.4f+rng.nextFloat()*0.8f,p)
                          }
                      }
                      else -> { // Fog: layered translucent wisps with atmospheric diffusion.
                          for (i in 0 until 32) {
                              val y = (i.toFloat()/32f)*H + (rng.nextFloat()-0.5f)*80f
                              cloud(randx(),y,90f+rng.nextFloat()*145f,
                                  28f+rng.nextFloat()*68f,
                                  if(i%4==0) mix(accent,Color.WHITE,0.55f)
                                  else mix(panel,Color.WHITE,0.4f),
                                  alpha(if(i%4==0) 26f else 36f))
                          }
                          for (i in 0 until 8) {
                              val x=randx()-40f; val y=randy()
                              p.style=Paint.Style.STROKE
                              p.strokeWidth=0.6f+rng.nextFloat()*1.1f
                              p.color=tint(mix(accent,Color.WHITE,0.65f),alpha(18f))
                              val path=Path().apply {
                                  moveTo(x,y);cubicTo(x+70f,y-24f,x+160f,y+30f,x+260f,y-2f)
                              }
                              c.drawPath(path,p)
                          }
                      }
                  }
                  cache[key] = bitmap
                  return bitmap
              }
          }
          '''

          """Android 2.15 applied after 2.13 patch: top-to-bottom techno + five themed backgrounds.
          The user skipped the uninstalled 2.14 release. The version jumps directly 2.13 -> 2.15.
          """
          from pathlib import Path
          ROOT=Path.cwd()
          MAIN=ROOT/'app/src/main/java/com/oukitel/monitor/MainActivity.kt'
          UPD=ROOT/'app/src/main/java/com/oukitel/monitor/UpdateManager.kt'
          GRADLE=ROOT/'app/build.gradle.kts'
          BACKGROUND=ROOT/'app/src/main/java/com/oukitel/monitor/InterfaceBackground.kt'
          main=MAIN.read_text(encoding='utf-8')
          upd=UPD.read_text(encoding='utf-8')
          gradle=GRADLE.read_text(encoding='utf-8')

          def once(s,old,new,label):
              count=s.count(old)
              if count!=1: raise RuntimeError(f'2.15 {label}: expected one anchor, found {count}: {old[:100]}')
              return s.replace(old,new,1)

          # Techno 2.14 correction is part of 2.15.  Both lower ends are fixed; the
          # illuminated bars lose their TOP portions as the charge percentage decreases.
          main=once(main,
              '''                    arcStroke(arc, firstRight, sweep*ratio, width, active, true, false)
                              arcStroke(arc, firstLeft, -sweep*ratio, width, active, true, false)''',
              '''                    // The lower ends remain anchored: both top edges recede downwards.
                              arcStroke(arc, firstRight+sweep*(1f-ratio), sweep*ratio,
                                  width, active, true, false)
                              arcStroke(arc, firstLeft-sweep*(1f-ratio), -sweep*ratio,
                                  width, active, true, false)''',
              'synchronized top-to-bottom techno discharge')

          # Every existing app screen uses forestBackground(), including the nested
          # address-picker, dashboard, statistics and the new battery style screen.
          main=once(main,
              '''    private fun forestBackground(): GradientDrawable = GradientDrawable(
                  GradientDrawable.Orientation.TL_BR,
                  intArrayOf(blend(bg, Color.WHITE, .08f), bg, blend(bg, panel, .55f), blend(bg, Color.BLACK, .12f))
              )''',
              '''    private fun forestBackground(): android.graphics.drawable.Drawable =
                  InterfaceBackground.create(this, bg, panel, green,
                      prefs().getInt("interface_background_style", 0),
                      prefs().getInt("interface_background_intensity", 1))''',
              'shared themed surface for all screens')

          background_menu=r'''    /** Dedicated background style picker with real rendered previews. */
              private fun showInterfaceBackgroundStyles() {
                  currentScreen = "background_styles"
                  active = false
                  handler.removeCallbacks(tick)
                  val root = column().apply {
                      background = forestBackground()
                      setPadding(dp(18), dp(23), dp(18), dp(28))
                  }
                  add(root, text("‹   Налаштування", 18f, green, true).apply {
                      setPadding(dp(2), dp(8), dp(2), dp(8))
                      setOnClickListener { showSettings() }
                  })
                  gap(root, 15)
                  add(root, text("Фон інтерфейсу", 27f, white, true))
                  gap(root, 8)
                  add(root, text("П'ять текстур. Кожна підлаштовується під кольори обраної теми.",
                      13f, muted))
                  gap(root, 16)
                  val names = arrayOf("Градієнт", "Граніт", "Геометричні грані",
                      "Матовий димчастий", "Туман")
                  val descriptions = arrayOf(
                      "Плавні переходи кольорів",
                      "Мінеральна фактура з прожилками",
                      "Об'ємні полігональні поверхні",
                      "М'які темні димчасті шари",
                      "Повітряні світлі шари серпанку")
                  val p = prefs()
                  val selected = p.getInt("interface_background_style", 0).coerceIn(0, 4)
                  val intensity = p.getInt("interface_background_intensity", 1).coerceIn(0, 2)
                  for (i in names.indices) {
                      val chosen = selected == i
                      val card = row().apply {
                          gravity = Gravity.CENTER_VERTICAL
                          background = shape(if (chosen) palette.tile else panel, 20,
                              if (chosen) green else null)
                          setPadding(dp(10), dp(9), dp(11), dp(9))
                          elevation = dp(3).toFloat()
                      }
                      val preview = View(this).apply {
                          background = InterfaceBackground.create(this@MainActivity,
                              bg, panel, green, i, intensity, 14, if (chosen) green else muted)
                      }
                      card.addView(preview, LinearLayout.LayoutParams(dp(100), dp(84)))
                      val info = column().apply { setPadding(dp(13), 0, 0, 0) }
                      add(info, text(names[i], 16f, white, true))
                      gap(info, 5)
                      add(info, text(descriptions[i], 12f, muted))
                      gap(info, 7)
                      add(info, text(if (chosen) "✓  Обрано" else "Натисни, щоб вибрати",
                          12f, if (chosen) green else muted, chosen))
                      card.addView(info, LinearLayout.LayoutParams(0, -2, 1f))
                      add(root, card)
                      gap(root, 10)
                      card.setOnClickListener {
                          if (p.getInt("interface_background_style", 0) != i) {
                              p.edit().putInt("interface_background_style", i).apply()
                              showInterfaceBackgroundStyles()
                          }
                      }
                  }
                  gap(root, 12)
                  add(root, text("Інтенсивність текстури", 18f, white, true))
                  gap(root, 8)
                  val levels = arrayOf("Слабка", "Середня", "Виразна")
                  val value = text(levels[intensity], 15f, green, true).apply {
                      gravity = Gravity.CENTER
                  }
                  add(root, value)
                  val slider = SeekBar(this).apply { max = 2; progress = intensity }
                  add(root, slider)
                  add(root, text("Слабка   ·   Середня   ·   Виразна", 12f, muted).apply {
                      gravity = Gravity.CENTER
                  })
                  slider.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(bar: SeekBar?, progress: Int, fromUser: Boolean) {
                          value.text = levels[progress.coerceIn(0, 2)]
                      }
                      override fun onStartTrackingTouch(bar: SeekBar?) {}
                      override fun onStopTrackingTouch(bar: SeekBar?) {
                          if (p.getInt("interface_background_intensity", 1) != slider.progress) {
                              p.edit().putInt("interface_background_intensity", slider.progress).apply()
                              showInterfaceBackgroundStyles()
                          }
                      }
                  })
                  gap(root, 15)
                  add(root, text("Узор не впливає на показники станції, сповіщення " +
                      "чи графіки. Змінюється лише оформлення.", 12f, muted))
                  setContentView(ScrollView(this).apply {
                      background = forestBackground()
                      isFillViewport = true
                      addView(root)
                  })
              }

          '''
          main=once(main,'    private fun showSettings() {',background_menu+'    private fun showSettings() {',
                    'new background settings screen')
          main=once(main,
              '        add(root, indicatorMenu); gap(root,26)',
              '''        add(root, indicatorMenu); gap(root,12)
                  val bgNames = arrayOf("Градієнт", "Граніт", "Геометричні грані",
                      "Матовий димчастий", "Туман")
                  settingsItem(root, "▧  Фон інтерфейсу",
                      bgNames[prefs().getInt("interface_background_style", 0).coerceIn(0, 4)]) {
                      showInterfaceBackgroundStyles()
                  }
                  gap(root,14)''',
              'single background settings button')
          main=once(main,
              '"outage_settings", "battery_styles" -> showSettings()',
              '"outage_settings", "battery_styles", "background_styles" -> showSettings()',
              'Android Back navigation for new background screen')

          # Reuse exactly the same texture engine for both themed update-check dialogs
          # and the in-app download dialog, preserving controls/progress/checksum logic.
          upd=once(upd,
              '            background=shape(panel,24,accent)',
              '''            background=InterfaceBackground.create(activity, bg, panel, accent,
                          p.getInt("interface_background_style", 0),
                          p.getInt("interface_background_intensity", 1), 24, accent)''',
              'theme texture for update-check dialogs')
          start='''            background = android.graphics.drawable.GradientDrawable(
                          android.graphics.drawable.GradientDrawable.Orientation.TL_BR,
                          intArrayOf(panelColor, pageColor)).apply {
                          cornerRadius = dp(26).toFloat()
                          setStroke(dp(2), accentColor)
                      }'''
          upd=once(upd,start,
              '''            background = InterfaceBackground.create(activity,
                          pageColor, panelColor, accentColor,
                          activity.getSharedPreferences(PREFS, Activity.MODE_PRIVATE)
                              .getInt("interface_background_style", 0),
                          activity.getSharedPreferences(PREFS, Activity.MODE_PRIVATE)
                              .getInt("interface_background_intensity", 1),
                          26, accentColor)''',
              'theme texture for APK download progress dialog')

          gradle=once(gradle, 'versionName = "2.13"','versionName = "2.15"',
                      'skip uninstalled 2.14 and bump directly to 2.15')

          if BACKGROUND.exists():
              raise RuntimeError('2.15: new texture renderer already exists')
          # The self-contained renderer source is appended by the workflow packaging
          # step as a Python raw literal assigned to BACKGROUND_KOTLIN.
          BACKGROUND.write_text(BACKGROUND_KOTLIN,encoding='utf-8')
          MAIN.write_text(main,encoding='utf-8')
          UPD.write_text(upd,encoding='utf-8')
          GRADLE.write_text(gradle,encoding='utf-8')
          print('OukitelMonitor 2.15: top-to-bottom techno arcs + 5 themed backgrounds, 3 intensities')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found"
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load existing signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.MALINFOREST_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.MALINFOREST_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.MALINFOREST_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.MALINFOREST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing GitHub Secret for $secret in this repository"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oukitel-release.jks"
          test -s "$RUNNER_TEMP/oukitel-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/oukitel-release.jks" \
            -storetype PKCS12 -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "OUKITEL_BUILD_CODE=$((250000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "OUKITEL_KEYSTORE_FILE=$RUNNER_TEMP/oukitel-release.jks" >> "$GITHUB_ENV"
          echo "OUKITEL_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OUKITEL_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OUKITEL_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test power alert transitions
        run: gradle --no-daemon testReleaseUnitTest

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK digital signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            "app/build/outputs/apk/release/app-release.apk"

      - name: Name APK from Android version
        id: apk_name
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          versions = re.findall(r'^\s*versionName\s*=\s*"([^"]+)"\s*$', gradle, re.MULTILINE)
          if len(versions) != 1 or not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,3}(?:[-.][a-zA-Z0-9]+)*", versions[0]):
              raise SystemExit("Cannot determine a safe unique versionName")
          version = versions[0]
          source = Path("app/build/outputs/apk/release/app-release.apk")
          if not source.is_file():
              raise SystemExit("Signed APK was not produced")
          target = source.with_name(f"OukitelMonitor-{version}.apk")
          source.rename(target)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
              f.write(f"apk_path={target.as_posix()}\n")
          print("Release APK:", target)
          PY

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OukitelMonitor-${{ steps.apk_name.outputs.version }}
          path: ${{ steps.apk_name.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VERSION: ${{ steps.apk_name.outputs.version }}
          APK_PATH: ${{ steps.apk_name.outputs.apk_path }}
        run: |
          set -euo pipefail
          tag="v${APK_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' | grep -Fxq "$(basename "$APK_PATH")"; then
              echo "::notice::Release $tag already has this APK. Increase versionName for the next version."
            else
              gh release upload "$tag" "$APK_PATH" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Oukitel Monitor ${APK_VERSION}" \
              --notes "Підписане оновлення Android-додатка Oukitel Monitor ${APK_VERSION}." \
              --latest
          fi

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/oukitel-release.jks"
